<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.5" stop-color="#F2622E"/>
      <stop offset="1" stop-color="#C92D5C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.95" r="0.7">
      <stop offset="0" stop-color="#FFE3A3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFE3A3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.55" stop-color="#F3E6D3"/>
      <stop offset="1" stop-color="#D9C3A5"/>
    </linearGradient>
    <linearGradient id="frameEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#B89A76" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B2A6B"/>
      <stop offset="0.55" stop-color="#E0588A"/>
      <stop offset="1" stop-color="#FFB16B"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset="0.6" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E3B78"/>
      <stop offset="1" stop-color="#5A2557"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1F4F"/>
      <stop offset="1" stop-color="#2A1233"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1DC"/>
      <stop offset="0.35" stop-color="#E9CFA9"/>
      <stop offset="1" stop-color="#B98B5E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="12" result="b"/>
      <feFlood flood-color="#5A0F2A" flood-opacity="0.45"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="photo"><rect x="160" y="128" width="192" height="206" rx="10"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#tile)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>

  <!-- the mantel -->
  <g filter="url(#drop)">
    <rect x="76" y="358" width="360" height="40" rx="12" fill="url(#shelf)"/>
    <rect x="76" y="358" width="360" height="8" rx="4" fill="#FFFFFF" opacity="0.55"/>
  </g>

  <!-- picture frame -->
  <g filter="url(#drop)">
    <rect x="132" y="100" width="248" height="262" rx="24" fill="url(#frame)"/>
    <rect x="133.5" y="101.5" width="245" height="259" rx="22.5" fill="none" stroke="url(#frameEdge)" stroke-width="3"/>
    <rect x="156" y="124" width="200" height="214" rx="13" fill="#B08E69" opacity="0.55"/>
    <g clip-path="url(#photo)">
      <rect x="160" y="128" width="192" height="206" fill="url(#sky)"/>
      <circle cx="256" cy="244" r="42" fill="url(#sun)"/>
      <path d="M160 270 C 200 236, 236 246, 268 262 S 330 238, 352 252 V334 H160 Z" fill="url(#hillBack)"/>
      <path d="M160 300 C 210 270, 250 292, 290 286 S 340 276, 352 284 V334 H160 Z" fill="url(#hillFront)"/>
      <rect x="160" y="128" width="192" height="80" fill="url(#gloss)" opacity="0.5"/>
    </g>
  </g>

  <!-- glass highlight -->
  <path d="M0 116 A116 116 0 0 1 116 0 H396 A116 116 0 0 1 512 116 V170 C 380 140, 150 140, 0 210 Z" fill="url(#gloss)" opacity="0.32"/>
</svg>
