<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent; overflow: hidden; }
  .bar {
    height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 10px 0 84px;
    -webkit-app-region: drag;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(20px) saturate(1.5);
    border-bottom: 1px solid var(--sep);
  }
  .nav { display: flex; gap: 2px; }
  .icon {
    -webkit-app-region: no-drag; width: 32px; height: 30px; border-radius: 8px; background: none;
    display: grid; place-items: center; color: var(--label); transition: background .15s;
  }
  .icon:hover:not(:disabled) { background: var(--fill); }
  .icon:active:not(:disabled) { transform: scale(.94); }
  .icon:disabled { color: var(--label-3); cursor: default; }
  .icon svg { width: 18px; height: 18px; }
  .title { flex: 1; text-align: center; font-weight: 600; font-size: 13.5px; color: var(--label); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill {
    -webkit-app-region: no-drag; height: 28px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
    background: var(--fill); color: var(--label); display: inline-flex; align-items: center; gap: 6px;
  }
  .pill:hover { background: color-mix(in srgb, var(--tint) 16%, transparent); color: var(--tint); }
  .loading .reload svg { animation: spin .8s linear infinite; }
  .pill.update { background: linear-gradient(135deg, var(--tint-2), var(--tint) 55%, #e2366b); color: #fff; animation: glow 2.4s ease-in-out infinite; }
  .pill.update:hover { color: #fff; filter: brightness(1.08); }
  .pill.update:disabled { animation: none; opacity: .9; cursor: default; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 0 0 rgb(242 98 46 / .45); } 50% { box-shadow: 0 0 0 6px rgb(242 98 46 / 0); } }
</style>
</head>
<body>
  <div class="bar" id="bar">
    <div class="nav">
      <button class="icon" id="back" title="Back (⌘[)" aria-label="Back" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="icon" id="forward" title="Forward (⌘])" aria-label="Forward" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <button class="icon" id="home" title="Home (⌘1)" aria-label="Home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5L12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg>
      </button>
      <button class="icon reload" id="reload" title="Reload (⌘R)" aria-label="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
      </button>
    </div>
    <div class="title" id="title">Mantel</div>
    <button class="pill update" id="update" title="Install the new version" style="display:none"></button>
    <button class="pill" id="setup" title="Set up the Mac screensaver">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
      Screensaver
    </button>
    <button class="icon" id="help" title="Help" aria-label="Help">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 0 1 5 0c0 1.7-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r=".6" fill="currentColor"/></svg>
    </button>
  </div>
<script>
  const $ = (id) => document.getElementById(id);
  ['back', 'forward', 'home', 'reload', 'setup', 'help', 'update'].forEach((a) => ($(a).onclick = () => window.mantelToolbar.act(a)));
  window.mantelToolbar.onState((s) => {
    $('back').disabled = !s.canGoBack;
    $('forward').disabled = !s.canGoForward;
    $('title').textContent = s.section;
    $('bar').classList.toggle('loading', s.loading);
    $('setup').style.display = s.section === 'Screensaver setup' ? 'none' : '';
    const u = $('update');
    u.style.display = s.update ? '' : 'none';
    u.disabled = s.updating !== null && s.updating !== undefined;
    u.textContent = u.disabled ? `Updating… ${Math.round((s.updating || 0) * 100)}%` : `Update to ${s.update}`;
  });
  window.mantelToolbar.act('ready');
  document.addEventListener('dblclick', (e) => { if (e.target.id === 'bar' || e.target.id === 'title') window.mantelToolbar.act('zoom'); });
</script>
</body>
</html>
