  <text x="300" y="64" text-anchor="middle" font-family="-apple-system, Helvetica" font-size="24" font-weight="700" fill="#2b1a12">Drag Mantel to Applications</text>
  <text x="300" y="92" text-anchor="middle" font-family="-apple-system, Helvetica" font-size="13" fill="#7a5a48">Then open it from Applications to set up your screensaver.</text>
